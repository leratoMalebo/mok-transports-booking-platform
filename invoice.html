<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tax Invoice | Mok Transports</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root{
  --navy:#0d2137;
  --blue:#1565c0;
  --border:#dce3ec;
}

body{
  font-family:'Barlow',sans-serif;
  background:#f0f4f8;
  margin:0;
}

/* ===== FIX SPACING ===== */
.page-wrap{
  max-width:980px;
  margin:10px auto; /* reduced */
  padding:0 10px 20px;
}

/* ===== DOCUMENT ===== */
.invoice-doc{
  background:#fff;
  border:1px solid var(--border);
}

/* HEADER */
.inv-header{
  display:flex;
  justify-content:space-between;
  padding:18px 20px; /* reduced */
  background:var(--navy);
  color:#fff;
}

.inv-header img{
  height:40px;
}

.inv-type-badge{
  font-size:22px;
  font-weight:800;
}

/* META */
.inv-meta-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
}

.inv-meta-cell{
  padding:10px;
  border-right:1px solid var(--border);
}

.inv-meta-input{
  width:100%;
  border:none;
  font-weight:700;
}

/* TABLE */
.inv-table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

.inv-table th{
  background:var(--navy);
  color:#fff;
  padding:6px;
}

.inv-table td{
  border-bottom:1px solid var(--border);
  padding:6px;
  text-align:center;
}

/* BUTTONS */
.action-bar{
  padding:10px;
  background:#0d2137;
}

.add-row-btn{
  padding:10px;
  width:100%;
  border:none;
  cursor:pointer;
}

/* ===== PRINT FIX ===== */
@media print{
  .action-bar,
  .add-row-btn{
    display:none !important;
  }

  body{
    background:#fff;
  }

  .page-wrap{
    margin:0;
    padding:0;
  }
}
</style>
</head>

<body>

<div class="action-bar" id="actionBar">
  <button onclick="downloadPDF()">Download PDF</button>
</div>

<div class="page-wrap">
<div class="invoice-doc" id="invoiceDoc">

<!-- HEADER -->
<div class="inv-header">
  <div>
    <img src="assets/images/mok-logo.png">
    <div>Mok Transports Services</div>
  </div>
  <div class="inv-type-badge">TAX INVOICE</div>
</div>

<!-- META -->
<div class="inv-meta-grid">
  <div class="inv-meta-cell">
    Invoice No
    <input id="invoiceNumber" class="inv-meta-input">
  </div>
  <div class="inv-meta-cell">
    Date
    <input type="date" id="invoiceDate" class="inv-meta-input">
  </div>
  <div class="inv-meta-cell">
    Due
    <input type="date" id="dueDate" class="inv-meta-input">
  </div>
</div>

<!-- WAYBILL SELECTOR -->
<div style="padding:10px">
  <strong>Select Waybill:</strong>
  <select id="waybillSelect" onchange="loadWaybill()"></select>
</div>

<!-- TABLE -->
<table class="inv-table">
<thead>
<tr>
<th>Service</th>
<th>Waybill</th>
<th>From</th>
<th>To</th>
<th>Basic</th>
<th>Total</th>
</tr>
</thead>
<tbody id="invoiceLines"></tbody>
</table>

<button class="add-row-btn" onclick="addLine()">+ Add Line Item</button>

</div>
</div>

<script>
const VAT = 0.15;

function generateInvoiceNumber(){
  let n = parseInt(localStorage.getItem("invCounter")||0)+1;
  localStorage.setItem("invCounter",n);
  return "INV"+String(n).padStart(6,"0");
}

/* LOAD WAYBILLS */
function loadWaybillList(){
  const select = document.getElementById("waybillSelect");
  select.innerHTML = `<option value="">-- Select Waybill --</option>`;

  for(let key in localStorage){
    if(key.startsWith("tracking_")){
      const data = JSON.parse(localStorage.getItem(key));
      const opt = document.createElement("option");
      opt.value = data.waybillNo;
      opt.textContent = data.waybillNo + " | " + data.shipTo;
      select.appendChild(opt);
    }
  }
}

/* LOAD SELECTED WAYBILL */
function loadWaybill(){
  const wb = document.getElementById("waybillSelect").value;
  if(!wb) return;

  const data = JSON.parse(localStorage.getItem("tracking_"+wb));

  addLine({
    waybill: wb,
    from: data.shipFrom,
    to: data.shipTo,
    basic: 100 // default pricing
  });
}

/* ADD ROW */
function addLine(data={}){
  const tr = document.createElement("tr");

  tr.innerHTML = `
    <td><input value="${data.service||''}"></td>
    <td><input value="${data.waybill||''}"></td>
    <td><input value="${data.from||''}"></td>
    <td><input value="${data.to||''}"></td>
    <td><input type="number" value="${data.basic||''}" oninput="calc(this)"></td>
    <td class="total">0.00</td>
  `;

  document.getElementById("invoiceLines").appendChild(tr);
}

/* CALCULATE */
function calc(el){
  const tr = el.closest("tr");
  const basic = parseFloat(el.value)||0;
  const total = basic + (basic*VAT);
  tr.querySelector(".total").innerText = total.toFixed(2);
}

/* PDF */
function downloadPDF(){
  document.getElementById("actionBar").style.display="none";

  html2pdf().from(document.getElementById("invoiceDoc")).save()
  .then(()=>{
    document.getElementById("actionBar").style.display="block";
  });
}

/* INIT */
window.onload = ()=>{
  document.getElementById("invoiceNumber").value = generateInvoiceNumber();

  const d = new Date();
  document.getElementById("invoiceDate").value = d.toISOString().slice(0,10);

  loadWaybillList();
  addLine();
}
</script>

</body>
</html>
