Mok Transports Shipment Tracking

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mok Transports | Track Shipment</title>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .topbar {
            background: #001f3f;
            padding: 20px;
        }

        .logo-title {
            display: flex;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
        }

        .logo-title img {
            width: 70px;
            margin-right: 15px;
        }

        .status-box {
            padding: 18px;
            border-radius: 14px;
            color: white;
            font-weight: bold;
            text-align: center;
            margin-top: 25px;
            font-size: 20px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        }

        .timeline-item {
            position: relative;
            border-left: 4px solid #0d47a1;
            padding-left: 25px;
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 0;
            width: 16px;
            height: 16px;
            background: #0d47a1;
            border-radius: 50%;
        }

        .timeline-item h6 {
            font-weight: bold;
            color: #0d47a1;
        }

        .tracking-card {
            background: #fff;
            max-width: 1100px;
            margin: 50px auto;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .tracking-card h2 {
            font-size: 42px;
            color: #001f4d;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .tracking-subtitle {
            color: #666;
            margin-bottom: 35px;
            font-size: 17px;
        }

        .tracking-form {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .tracking-form input {
            flex: 1;
            min-width: 300px;
            height: 60px;
            border: 2px solid #dcdcdc;
            border-radius: 12px;
            padding: 0 20px;
            font-size: 18px;
            outline: none;
            transition: 0.3s ease;
        }

        .tracking-form input:focus {
            border-color: #0056d6;
            box-shadow: 0 0 0 4px rgba(0, 86, 214, 0.1);
        }

        .tracking-form button {
            background: #0056d6;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 35px;
            height: 60px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .tracking-form button:hover {
            background: #003f9e;
            transform: translateY(-2px);
        }

        .tracking-note {
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="container">
            <div class="logo-title">
                <img src="assets/images/mok-logo.png">
                Mok Transports Shipment Tracking
            </div>
        </div>
    </div>

    <div class="tracking-card">

        <h2>Track Shipment</h2>

        <p class="tracking-subtitle">
            Enter your Mok Transports Waybill Number or JKJ Reference Number
        </p>

        <div class="tracking-form">

            <input type="text" id="trackingInput" placeholder="Enter Waybill No. or JKJ Reference" />

            <button onclick="trackShipment()">
                TRACK SHIPMENT
            </button>

            <p class="tracking-note">
                Track your shipment in real-time using your Mok Transports or JKJ reference number.
            </p>

        </div>

    </div>

    <div id="trackingResult" style="display:none;">

        <div class="row">

            <div class="col s12 m6">
                <h6><strong>Waybill:</strong></h6>
                <p id="waybillNo"></p>
            </div>

            <div class="col s12 m6">
                <h6><strong>JKJ Reference:</strong></h6>
                <p id="jkjRef"></p>
            </div>

        </div>

        <div id="statusBox" class="status-box">
            <div class="row" style="margin-top:30px;">

                <div class="col s12 m4">
                    <div class="card-panel center">
                        <h6>Current Location</h6>
                        <h5 id="currentLocation">Johannesburg Hub</h5>
                    </div>
                </div>

                <div class="col s12 m4">
                    <div class="card-panel center">
                        <h6>Last Updated</h6>
                        <h5 id="lastUpdated">--</h5>
                    </div>
                </div>

                <div class="col s12 m4">
                    <div class="card-panel center">
                        <h6>Service Type</h6>
                        <h5 id="serviceType">--</h5>
                    </div>
                </div>

            </div>
        </div>

        <div class="timeline" id="timeline">

        </div>

    </div>

    </div>

    </div>

    <script src="./assets/js/tracking.js"></script>

</body>

</html>
