<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mok Transports | Login</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy:   #0d2137;
  --blue:   #1565c0;
  --sky:    #1e88e5;
  --accent: #f57c00;
  --light:  #e8f0fe;
  --border: #dce3ec;
  --muted:  #607d8b;
  --white:  #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Barlow', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--navy);
  overflow: hidden;
}

/* ---- animated background ---- */
.bg-layer {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 10% 90%, rgba(21,101,192,.35) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 90% 10%, rgba(245,124,0,.18) 0%, transparent 55%),
    linear-gradient(160deg, #0d2137 0%, #0a1a2e 100%);
}
.bg-grid {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(30,136,229,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(30,136,229,.06) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* ---- page layout ---- */
.page {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  min-height: 100vh;
}

/* ---- top bar ---- */
.topbar {
  display: flex; align-items: center; justify-content: center;
  padding: 28px 40px 0;
  gap: 14px;
}
.topbar img { height: 48px; }
.topbar-brand {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px; font-weight: 700;
  color: var(--white); letter-spacing: .5px;
  line-height: 1.2;
}
.topbar-brand span { display: block; font-size: 11px; font-weight: 400; color: #90a4ae; letter-spacing: 2px; text-transform: uppercase; }

/* ---- main wrapper ---- */
.main {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 32px 20px 48px;
}

/* ---- card ---- */
.card {
  width: 100%; max-width: 460px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 12px;
  backdrop-filter: blur(16px);
  overflow: hidden;
  animation: slideUp .5s ease both;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---- role toggle ---- */
.role-toggle {
  display: grid; grid-template-columns: 1fr 1fr;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.role-btn {
  padding: 16px 10px;
  background: transparent; border: none;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; color: #78909c;
  cursor: pointer; transition: all .2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.role-btn .icon { font-size: 18px; }
.role-btn.active {
  color: var(--white);
  background: rgba(21,101,192,.25);
  border-bottom: 2px solid var(--accent);
}
.role-btn:hover:not(.active) { color: #b0bec5; background: rgba(255,255,255,.04); }

/* ---- form body ---- */
.form-body { padding: 32px 36px 36px; }

.form-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 24px; font-weight: 700;
  color: var(--white); margin-bottom: 4px;
  letter-spacing: .5px;
}
.form-subtitle { font-size: 13px; color: #78909c; margin-bottom: 28px; }

.field { margin-bottom: 20px; }
.field label {
  display: block; font-size: 11px; font-weight: 600;
  letter-spacing: 1.2px; text-transform: uppercase;
  color: #90a4ae; margin-bottom: 7px;
}
.field input {
  width: 100%; height: 46px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 6px;
  color: var(--white); font-family: 'Barlow', sans-serif; font-size: 14px;
  padding: 0 14px;
  transition: border-color .2s, background .2s;
  outline: none;
}
.field input:focus {
  border-color: var(--sky);
  background: rgba(30,136,229,.08);
}
.field input::placeholder { color: #455a64; }

.btn-login {
  width: 100%; height: 48px; margin-top: 8px;
  border: none; border-radius: 6px; cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase;
  background: linear-gradient(135deg, var(--blue) 0%, var(--sky) 100%);
  color: var(--white);
  transition: filter .2s, transform .1s;
  position: relative; overflow: hidden;
}
.btn-login::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--accent) 0%, #ff9800 100%);
  opacity: 0; transition: opacity .3s;
}
.btn-login:hover::after { opacity: 1; }
.btn-login span { position: relative; z-index: 1; }
.btn-login:active { transform: scale(.98); }

.error-msg {
  background: rgba(198,40,40,.2);
  border: 1px solid rgba(198,40,40,.4);
  border-radius: 6px; padding: 10px 14px;
  font-size: 13px; color: #ef9a9a;
  margin-bottom: 16px; display: none;
}
.error-msg.show { display: block; }

/* ---- footer ---- */
footer {
  position: relative; z-index: 1;
  text-align: center; padding: 16px;
  font-size: 11px; color: #37474f;
}

/* ---- role panel switching ---- */
.panel { display: none; }
.panel.active { display: block; }

@media (max-width: 480px) {
  .form-body { padding: 24px 20px 28px; }
}
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-grid"></div>

<div class="page">

  <!-- TOP BAR -->
  <div class="topbar">
    <img src="assets/images/mok-logo.png" alt="Mok Transports">
    <div class="topbar-brand">
      Mok Transports Services (Pty) Ltd
      <span>Logistics &amp; Freight Solutions</span>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="card">

      <!-- ROLE TOGGLE -->
      <div class="role-toggle">
        <button class="role-btn active" id="btnOffice" onclick="switchRole('office')">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
          Office Staff
        </button>
        <button class="role-btn" id="btnClient" onclick="switchRole('client')">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Client Portal
        </button>
      </div>

      <!-- OFFICE PANEL -->
      <div class="panel active" id="panelOffice">
        <div class="form-body">
          <div class="form-title">Staff Login</div>
          <div class="form-subtitle">Mok Transports internal operations portal</div>
          <div class="error-msg" id="officeError">Incorrect username or password.</div>
          <div class="field">
            <label>Username</label>
            <input type="text" id="officeUser" placeholder="Enter your username" autocomplete="username">
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="officePass" placeholder="Enter your password" autocomplete="current-password" onkeydown="if(event.key==='Enter') loginOffice()">
          </div>
          <button class="btn-login" onclick="loginOffice()"><span>Sign In to Office</span></button>
        </div>
      </div>

      <!-- CLIENT PANEL -->
      <div class="panel" id="panelClient">
        <div class="form-body">
          <div class="form-title">Client Login</div>
          <div class="form-subtitle">Track and manage your shipments</div>
          <div class="error-msg" id="clientError">Incorrect email or password.</div>
          <div class="field">
            <label>Email Address</label>
            <input type="email" id="clientEmail" placeholder="your@email.com" autocomplete="email">
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="clientPass" placeholder="Enter your password" autocomplete="current-password" onkeydown="if(event.key==='Enter') loginClient()">
          </div>
          <button class="btn-login" onclick="loginClient()"><span>Sign In to Portal</span></button>
        </div>
      </div>

    </div>
  </div>

  <footer>© 2026 Mok Transports Services (Pty) Ltd &nbsp;·&nbsp; All rights reserved</footer>
</div>

<script>
// ---- Role switching ----
function switchRole(role) {
  document.getElementById('btnOffice').classList.toggle('active', role === 'office');
  document.getElementById('btnClient').classList.toggle('active', role === 'client');
  document.getElementById('panelOffice').classList.toggle('active', role === 'office');
  document.getElementById('panelClient').classList.toggle('active', role === 'client');
}

// ---- Office users (extend as needed) ----
const OFFICE_USERS = [
  { username: 'it@moktransports.com',   password: 'Malebo2009', name: 'Admin',           role: 'admin' },
  { username: 'mavis@moktransports.com',   password: 'Karabo2009', name: 'Mavis Selomane', role: 'staff' },
  { username: 'neo@moktransports.com',   password: 'Karabo2009', name: 'Neo Lumkwana',      role: 'staff' },
  { username: 'ryan@moktransports.com',   password: 'Karabo2009', name: 'Ryan Mokgethi',      role: 'staff' }
  

];

// ---- Client users (extend as needed) ----
const CLIENT_USERS = [
  { email: 'client@moktransports.com', password: 'Mok2026', name: 'Demo Client', company: 'Demo Company' }
];

function loginOffice() {
  const u = document.getElementById('officeUser').value.trim().toLowerCase();
  const p = document.getElementById('officePass').value;
  const user = OFFICE_USERS.find(x => x.username === u && x.password === p);
  if (user) {
    localStorage.setItem('mokSession', JSON.stringify({ role: 'office', name: user.name, staffRole: user.role }));
    document.getElementById('officeError').classList.remove('show');
    window.location.href = 'dashboard.html';
  } else {
    document.getElementById('officeError').classList.add('show');
  }
}

function loginClient() {
  const e = document.getElementById('clientEmail').value.trim().toLowerCase();
  const p = document.getElementById('clientPass').value;
  const user = CLIENT_USERS.find(x => x.email === e && x.password === p);
  if (user) {
    localStorage.setItem('mokSession', JSON.stringify({ role: 'client', name: user.name, company: user.company, email: user.email }));
    document.getElementById('clientError').classList.remove('show');
    window.location.href = 'clientDashboard.html';
  } else {
    document.getElementById('clientError').classList.add('show');
  }
}
</script>
</body>
</html>
