<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mok Transports | Waybills</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --navy: #0d2137;
            --navy2: #132d47;
            --blue: #1565c0;
            --sky: #1e88e5;
            --green: #2e7d32;
            --orange: #f57c00;
            --red: #c62828;
            --bg: #f0f4f8;
            --card: #ffffff;
            --border: #dce3ec;
            --text: #1a2535;
            --muted: #607d8b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .topbar {
            height: 72px;
            background: var(--navy);
            border-bottom: 4px solid var(--blue);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand img {
            height: 42px;
            background: #fff;
            padding: 4px;
            border-radius: 3px;
        }

        .brand-title {
            font-family: 'Barlow Condensed', sans-serif;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: .6px;
            line-height: 1.1;
        }

        .brand-title span {
            display: block;
            color: #90a4ae;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .btn {
            height: 38px;
            border: none;
            border-radius: 5px;
            padding: 0 18px;
            cursor: pointer;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-blue {
            background: var(--blue);
            color: #fff;
        }

        .btn-green {
            background: var(--green);
            color: #fff;
        }

        .btn-grey {
            background: #546e7a;
            color: #fff;
        }

        .btn-orange {
            background: var(--orange);
            color: #fff;
        }

        .page {
            max-width: 1180px;
            margin: 28px auto;
            padding: 0 20px 60px;
        }

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 16px;
        }

        .page-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--navy);
            letter-spacing: .5px;
        }

        .page-subtitle {
            color: var(--muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .search-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 18px;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 4px 18px rgba(13, 33, 55, .05);
        }

        .search-input {
            flex: 1;
            height: 44px;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0 14px;
            font-family: 'Barlow', sans-serif;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(21, 101, 192, .08);
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 18px rgba(13, 33, 55, .05);
        }

        .panel-header {
            padding: 15px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafbfc;
            border-bottom: 1px solid var(--border);
        }

        .panel-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 16px;
            font-weight: 800;
            color: var(--navy);
            text-transform: uppercase;
            letter-spacing: .8px;
        }

        .count-pill {
            background: #e3f2fd;
            color: var(--blue);
            border-radius: 30px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead th {
            background: var(--navy);
            color: #fff;
            padding: 12px 14px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: left;
            white-space: nowrap;
        }

        tbody td {
            padding: 13px 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tbody tr:hover {
            background: #f5f8ff;
        }

        .waybill-no {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 16px;
            font-weight: 800;
            color: var(--navy);
            letter-spacing: .5px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .4px;
            white-space: nowrap;
        }

        .badge-created {
            background: #e3f2fd;
            color: var(--blue);
        }

        .badge-sent {
            background: #e8f5e9;
            color: var(--green);
        }

        .badge-not-sent {
            background: #fff3e0;
            color: #e65100;
        }

        .small-muted {
            color: var(--muted);
            font-size: 12px;
        }

        .empty {
            padding: 36px;
            text-align: center;
            color: var(--muted);
        }

        @media(max-width:850px) {
            .topbar {
                padding: 0 18px;
            }

            .page-header,
            .search-card {
                flex-direction: column;
                align-items: stretch;
            }

            table {
                min-width: 850px;
            }

            .panel {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="brand">
            <img src="assets/images/mok-logo.png" alt="Mok Transports">
            <div class="brand-title">
                Mok Transports Services (Pty) Ltd
                <span>Waybill Management</span>
            </div>
        </div>

        <a class="btn btn-grey" href="dashboard.html">Dashboard</a>
    </div>

    <main class="page">
        <div class="page-header">
            <div>
                <div class="page-title">Saved Waybills</div>
                <div class="page-subtitle">View, search and prepare waybills for JKJ Express integration.</div>
            </div>

            <a class="btn btn-blue" href="booking.html">New Booking</a>
        </div>

        <div class="search-card">
            <input class="search-input" type="text" id="searchInput"
                placeholder="Search by waybill number, service, client, or status..." oninput="searchWaybills()">
            <button class="btn btn-orange" onclick="clearSearch()">Clear</button>
            <button class="btn btn-blue" onclick="loadWaybills()">Refresh</button>
        </div>

        <section class="panel">
            <div class="panel-header">
                <div class="panel-title">Waybill Records</div>
                <div class="count-pill"><span id="waybillCount">0</span> records</div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Waybill No.</th>
                        <th>Service</th>
                        <th>Consignor</th>
                        <th>Consignee</th>
                        <th>Weight</th>
                        <th>Volumetric</th>
                        <th>Status</th>
                        <th>JKJ Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="waybillTable">
                    <tr>
                        <td colspan="9" class="empty">Loading waybills...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script>
        const API_BASE = "https://mok-transports-booking-platform-io2vvsoum.vercel.app/";

        async function loadWaybills() {
            try {
                const res = await fetch(`${API_BASE}/api/waybills`);
                const data = await res.json();
                renderWaybills(data);
            } catch (err) {
                console.error(err);
                showError();
            }
        }

        async function searchWaybills() {
            try {
                const q = document.getElementById("searchInput").value.trim();
                const url = q
                    ? `${API_BASE}/api/waybills/search?q=${encodeURIComponent(q)}`
                    : `${API_BASE}/api/waybills`;

                const res = await fetch(url);
                const data = await res.json();
                renderWaybills(data);
            } catch (err) {
                console.error(err);
                showError();
            }
        }

        function clearSearch() {
            document.getElementById("searchInput").value = "";
            loadWaybills();
        }

        function renderWaybills(data) {
            const tbody = document.getElementById("waybillTable");
            const count = document.getElementById("waybillCount");

            count.textContent = Array.isArray(data) ? data.length : 0;

            if (!Array.isArray(data) || !data.length) {
                tbody.innerHTML = `<tr><td colspan="9" class="empty">No waybills found.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(w => `
    <tr>
      <td>
        <div class="waybill-no">${w.waybill_no || "—"}</div>
        <div class="small-muted">${formatDate(w.created_at)}</div>
      </td>

      <td>${w.service || "—"}</td>
      <td>${w.consignor_name || "—"}</td>
      <td>${w.consignee_name || "—"}</td>
      <td>${w.weight || "—"} kg</td>
      <td>${w.volumetric_weight || "—"} kg</td>

      <td>
        <span class="badge badge-created">${w.status || "created"}</span>
      </td>

      <td>
  ${w.sent_to_jkj
                    ? `
        <span class="badge badge-sent">Sent to JKJ</span>
        ${w.jkj_reference ? `<div class="small-muted">Ref: ${w.jkj_reference}</div>` : ""}
      `
                    : `<span class="badge badge-not-sent">Not Sent</span>`
                }
</td>
      <td style="display:flex; gap:6px; flex-wrap:wrap;">
        <button class="btn btn-blue" onclick="viewWaybill('${w.waybill_no}')">
          View
        </button>

        <button class="btn btn-orange" onclick="downloadWaybillPDF('${w.waybill_no}')">
          PDF
        </button>

        ${w.sent_to_jkj
                    ? `<button class="btn btn-grey" disabled>Sent</button>`
                    : `<button class="btn btn-green" onclick="sendToJKJ('${w.waybill_no}')">Send to JKJ</button>`
                }
      </td>
    </tr>
  `).join("");
        }
        function showError() {
            document.getElementById("waybillTable").innerHTML =
                `<tr><td colspan="9" class="empty">Could not load waybills. Check that backend is running.</td></tr>`;
        }

        function formatDate(dateValue) {
            if (!dateValue) return "";
            const d = new Date(dateValue);
            return d.toLocaleDateString("en-ZA", {
                year: "numeric",
                month: "short",
                day: "2-digit"
            });
        }

        async function sendToJKJ(waybillNo) {
            try {
                const confirmSend = confirm(`Send waybill ${waybillNo} to JKJ Express?`);
                if (!confirmSend) return;

                const res = await fetch(`${API_BASE}/api/waybills/${waybillNo}/send-to-jkj`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }
                });

                const result = await res.json();

                if (!res.ok) {
                    throw new Error(result.error || "Failed to send waybill to JKJ");
                }

                alert(`✅ Waybill ${waybillNo} sent to JKJ successfully.`);
                loadWaybills();

            } catch (err) {
                console.error("JKJ send error:", err);
                alert("❌ Failed to send waybill to JKJ.");
            }
        }

        function viewWaybill(waybillNo) {
            localStorage.setItem("selectedWaybillNo", waybillNo);
            window.location.href = `localWaybill.html?waybill=${encodeURIComponent(waybillNo)}&mode=view`;
        }

        function downloadWaybillPDF(waybillNo) {
            localStorage.setItem("selectedWaybillNo", waybillNo);
            window.location.href = `localWaybill.html?waybill=${encodeURIComponent(waybillNo)}&download=true`;
        }

        loadWaybills();
    </script>

</body>

</html>
