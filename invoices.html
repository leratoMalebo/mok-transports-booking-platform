<!DOCTYPE html>
<html>

<head>
  <title>Mok Transports — Invoices</title>

  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Barlow', sans-serif;
      background: #f4f6f9;
      margin: 0;
    }

    /* TOP BAR */
    .topbar {
      background: #0d2137;
      color: white;
      padding: 0 32px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 4px solid #1565c0;
      box-shadow: 0 4px 18px rgba(13, 33, 55, 0.18);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand img {
      height: 46px;
      width: auto;
      object-fit: contain;
      background: #ffffff;
      padding: 5px;
      border-radius: 6px;
    }

    .brand-name {
      font-family: 'Barlow', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .brand-subtitle {
      font-size: 11px;
      color: #90a4ae;
      margin-top: 3px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .topbar-btn {
      height: 38px;
      padding: 0 18px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .topbar-btn.grey {
      background: #546e7a;
    }

    .topbar-btn.blue {
      background: #1565c0;
    }

    /* PAGE */
    .container {
      padding: 25px;
      max-width: 1300px;
      margin: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .title {
      font-size: 24px;
      font-weight: 600;
      color: #0d47a1;
    }

    .search-box {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 300px;
    }

    /* CARD */
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #0d47a1;
      color: white;
    }

    th,
    td {
      padding: 14px;
      text-align: left;
    }

    td {
      border-bottom: 1px solid #eee;
    }

    tbody tr:hover {
      background: #eef4ff;
      transition: background 0.2s ease-in-out;
    }

    thead tr:hover {
      background: #0d47a1 !important;
    }

    .invoice-no {
      font-weight: 600;
      color: #0d47a1;
    }

    .small-muted {
      font-size: 12px;
      color: #777;
    }

    /* BADGES */
    .badge {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .badge-unpaid {
      background: #ffe0b2;
      color: #e65100;
    }

    .badge-paid {
      background: #c8e6c9;
      color: #1b5e20;
    }

    /* BUTTONS */
    .btn {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      color: white;
    }

    .btn-blue {
      background: #1976d2;
    }

    .btn-orange {
      background: #fb8c00;
    }

    .btn-green {
      background: #2e7d32;
    }

    .btn-grey {
      background: #9e9e9e;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #888;
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand">
      <img src="assets/images/mok-logo.png" alt="Mok Transports Logo">

      <div>
        <div class="brand-name">Mok Transports Services (Pty) Ltd</div>
        <div class="brand-subtitle">Invoice Management Portal</div>
      </div>
    </div>

    <div class="topbar-actions">
      <a href="dashboard.html" class="topbar-btn grey">Dashboard</a>
      <a href="invoice.html" class="topbar-btn blue">New Invoice</a>
    </div>
  </div>

  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <div class="title">📄 Invoices</div>

      <input type="text" id="search" class="search-box" placeholder="Search invoice or waybill..."
        oninput="filterInvoices()">
    </div>

    <!-- TABLE -->
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Invoice</th>
            <th>Date</th>
            <th>Waybill</th>
            <th>Total</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="invoiceTable"></tbody>
      </table>
    </div>

  </div>

  <script>

    const API_BASE = "https://bookings.moktransports.com";
    let allInvoices = [];

    async function loadInvoices() {
      try {
        const res = await fetch(`${API_BASE}/api/invoices`);
        const data = await res.json();

        allInvoices = data;
        renderInvoices(data);
      } catch (err) {
        console.error("Failed to load invoices:", err);
        document.getElementById("invoiceTable").innerHTML = `
      <tr>
        <td colspan="6" class="empty">Could not load invoices from database.</td>
      </tr>
    `;
      }
    }

    function renderInvoices(data) {
      const tbody = document.getElementById("invoiceTable");

      if (!Array.isArray(data) || data.length === 0) {
        tbody.innerHTML = `
      <tr>
        <td colspan="6" class="empty">No saved invoices found.</td>
      </tr>
    `;
        return;
      }

      tbody.innerHTML = data.map(inv => `
    <tr onclick="viewInvoice('${inv.invoice_no}')" style="cursor:pointer;">
      <td>
        <div class="invoice-no">${inv.invoice_no}</div>
        <div class="small-muted">${formatDate(inv.created_at)}</div>
      </td>

      <td>${formatDate(inv.invoice_date)}</td>
      <td>${inv.waybill_no || "—"}</td>
      <td><strong>R ${Number(inv.total || 0).toFixed(2)}</strong></td>

      <td>
        <span class="badge ${inv.status === "paid" ? "badge-paid" : "badge-unpaid"}">
          ${inv.status || "unpaid"}
        </span>
      </td>

      <td class="actions" onclick="event.stopPropagation();">
        <button class="btn btn-blue" onclick="viewInvoice('${inv.invoice_no}')">View</button>
        <button class="btn btn-orange" onclick="downloadInvoice('${inv.invoice_no}')">PDF</button>
        <button class="btn btn-green" onclick="sendInvoiceFromList('${inv.invoice_no}')">Send</button>
      </td>
    </tr>
  `).join("");
    }

    function filterInvoices() {
      const q = document.getElementById("search").value.toLowerCase();

      const filtered = allInvoices.filter(inv =>
        (inv.invoice_no || "").toLowerCase().includes(q) ||
        (inv.waybill_no || "").toLowerCase().includes(q) ||
        (inv.status || "").toLowerCase().includes(q)
      );

      renderInvoices(filtered);
    }

    function formatDate(value) {
      if (!value) return "—";
      return new Date(value).toLocaleDateString("en-ZA");
    }

    function viewInvoice(invoiceNo) {
      localStorage.setItem("selectedInvoiceNo", invoiceNo);
      window.location.href = `invoice.html?invoice=${encodeURIComponent(invoiceNo)}`;
    }

    function downloadInvoice(invoiceNo) {
      localStorage.setItem("selectedInvoiceNo", invoiceNo);
      window.location.href = `invoice.html?invoice=${encodeURIComponent(invoiceNo)}&download=true`;
    }

    function sendInvoiceFromList(invoiceNo) {
      localStorage.setItem("selectedInvoiceNo", invoiceNo);
      window.location.href = `invoice.html?invoice=${encodeURIComponent(invoiceNo)}&send=true`;
    }

    loadInvoices();

  </script>

</body>

</html>
