<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Mok Transports — Invoices</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">


  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:   #0a1628;
      --navy2:  #0f2040;
      --blue:   #1565c0;
      --sky:    #2196f3;
      --green:  #2e7d32;
      --orange: #f57c00;
      --red:    #c62828;
      --teal:   #00796b;
      --bg:     #f0f4f9;
      --card:   #ffffff;
      --border: #dce4ef;
      --text:   #1a2535;
      --muted:  #607d8b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── TOPBAR ─────────────────────────────────── */
    .topbar {
      background: var(--navy);
      border-bottom: 3px solid var(--blue);
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 24px rgba(10,22,40,.3);
    }

    .brand { display: flex; align-items: center; gap: 14px }
    .brand img {
      height: 40px; background: #fff;
      padding: 4px 6px; border-radius: 6px;
    }
    .brand-text { line-height: 1.15 }
    .brand-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px; font-weight: 800;
      letter-spacing: .5px; color: #fff;
    }
    .brand-sub {
      font-size: 10px; color: #90a4ae;
      letter-spacing: 2px; text-transform: uppercase;
    }

    .topbar-right { display: flex; gap: 8px; align-items: center }
    .nav-btn {
      height: 36px; padding: 0 16px; border-radius: 6px;
      border: none; cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      text-decoration: none; display: inline-flex;
      align-items: center; gap: 7px; transition: .18s;
    }
    .nav-btn.ghost {
      background: rgba(255,255,255,.08);
      color: #90a4ae; border: 1px solid rgba(255,255,255,.1);
    }
    .nav-btn.ghost:hover { background: rgba(255,255,255,.14); color: #fff }
    .nav-btn.primary { background: var(--blue); color: #fff }
    .nav-btn.primary:hover { background: #1976d2 }

    /* ── PAGE ────────────────────────────────────── */
    .page {
      max-width: 1320px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* ── PAGE HEADER ─────────────────────────────── */
    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 28px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .page-title-block {}
    .page-eyebrow {
      font-size: 11px; font-weight: 600;
      letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--blue); margin-bottom: 4px;
    }
    .page-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 36px; font-weight: 800;
      letter-spacing: .5px; color: var(--navy);
      line-height: 1;
    }

    /* ── STAT CHIPS ──────────────────────────────── */
    .stat-chips {
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .stat-chip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 18px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 2px 8px rgba(10,22,40,.05);
    }
    .stat-chip-dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .stat-chip-label {
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--muted);
    }
    .stat-chip-value {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px; font-weight: 800; color: var(--navy);
    }

    /* ── TOOLBAR ─────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative; flex: 1; min-width: 240px; max-width: 420px;
    }
    .search-icon {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%); color: var(--muted);
      pointer-events: none;
    }
    .search-input {
      width: 100%; height: 40px;
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0 14px 0 40px;
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      background: var(--card); outline: none; color: var(--text);
      transition: .2s;
    }
    .search-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(21,101,192,.1);
    }

    .filter-tabs {
      display: flex; gap: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 3px;
    }
    .filter-tab {
      height: 32px; padding: 0 14px; border-radius: 6px;
      border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 600;
      color: var(--muted); background: transparent;
      transition: .18s; white-space: nowrap;
    }
    .filter-tab.active {
      background: var(--navy); color: #fff;
    }

    /* ── TABLE CARD ──────────────────────────────── */
    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(10,22,40,.06);
    }

    table { width: 100%; border-collapse: collapse }

    thead tr {
      background: var(--navy);
    }
    thead th {
      padding: 13px 16px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px; font-weight: 800;
      letter-spacing: 1.2px; text-transform: uppercase;
      color: #90a4ae; text-align: left;
      white-space: nowrap;
    }
    thead th:first-child { padding-left: 24px }
    thead th:last-child  { padding-right: 24px; text-align: right }

    tbody tr {
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .15s;
    }
    tbody tr:last-child { border-bottom: none }
    tbody tr:hover { background: #f5f8ff }

    tbody td {
      padding: 15px 16px;
      font-size: 13px;
      vertical-align: middle;
    }
    tbody td:first-child { padding-left: 24px }
    tbody td:last-child  { padding-right: 24px }

    /* invoice number cell */
    .inv-no {
      font-family: 'DM Mono', monospace;
      font-size: 13px; font-weight: 500;
      color: var(--blue); letter-spacing: .3px;
    }
    .inv-date {
      font-size: 11px; color: var(--muted); margin-top: 2px;
    }

    /* waybills cell */
    .waybill-chip {
      display: inline-block;
      background: #e3f2fd;
      color: #1565c0;
      border-radius: 4px;
      padding: 2px 7px;
      font-family: 'DM Mono', monospace;
      font-size: 11px; font-weight: 500;
      margin: 1px 2px 1px 0;
    }
    .waybill-none { color: var(--muted); font-size: 12px }

    /* amount */
    .amount {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 17px; font-weight: 800; color: var(--navy);
    }

    /* status badge */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
      letter-spacing: .4px; text-transform: uppercase;
      white-space: nowrap;
    }
    .badge::before {
      content: ''; width: 5px; height: 5px;
      border-radius: 50%; flex-shrink: 0;
    }
    .badge-unpaid {
      background: #fff3e0; color: #e65100;
    }
    .badge-unpaid::before { background: #e65100 }
    .badge-paid {
      background: #e8f5e9; color: #2e7d32;
    }
    .badge-paid::before { background: #2e7d32 }

    /* client cell */
    .client-name {
      font-size: 13px; font-weight: 600; color: var(--text);
    }
    .client-email {
      font-size: 11px; color: var(--muted); margin-top: 2px;
    }

    /* ── ACTION BUTTONS ──────────────────────────── */
    .actions { display: flex; gap: 5px; justify-content: flex-end }
    .act-btn {
      height: 30px; padding: 0 12px; border: none;
      border-radius: 5px; cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: .8px; text-transform: uppercase;
      transition: .15s; display: inline-flex; align-items: center; gap: 5px;
    }
    .act-btn svg { flex-shrink: 0 }
    .act-view    { background: #e3f2fd; color: #1565c0 }
    .act-view:hover { background: #1565c0; color: #fff }
    .act-pdf     { background: #fff3e0; color: #e65100 }
    .act-pdf:hover { background: #f57c00; color: #fff }
    .act-send    { background: #e8f5e9; color: #2e7d32 }
    .act-send:hover { background: #2e7d32; color: #fff }
    .act-paid    { background: #f3e5f5; color: #6a1b9a }
    .act-paid:hover { background: #6a1b9a; color: #fff }

    /* ── EMPTY / LOADING ─────────────────────────── */
    .empty-row td {
      padding: 60px 24px;
      text-align: center;
    }
    .empty-icon { font-size: 36px; margin-bottom: 10px }
    .empty-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px; font-weight: 800;
      color: var(--navy); margin-bottom: 4px;
    }
    .empty-sub { font-size: 13px; color: var(--muted) }

    .loading-row td {
      padding: 48px; text-align: center;
      color: var(--blue); font-size: 13px;
    }

    /* ── TOAST ───────────────────────────────────── */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 999;
      background: var(--navy); color: #fff;
      padding: 12px 20px; border-radius: 8px;
      font-size: 13px; font-weight: 500;
      box-shadow: 0 8px 24px rgba(10,22,40,.3);
      display: none; align-items: center; gap: 10px;
      animation: slideUp .3s ease;
    }
    .toast.show { display: flex }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(12px) }
      to   { opacity:1; transform:translateY(0) }
    }

    /* ── RESPONSIVE ──────────────────────────────── */
    @media (max-width: 900px) {
      .topbar { padding: 0 16px }
      .page { padding: 20px 12px 60px }
      .page-header { flex-direction: column; align-items: flex-start }
      table { min-width: 760px }
      .table-card { overflow-x: auto }
    }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="brand">
      <img src="assets/images/mok-logo.png" alt="Mok Transports">
      <div class="brand-text">
        <div class="brand-name">Mok Transports Services (Pty) Ltd</div>
        <div class="brand-sub">Invoice Management Portal</div>
      </div>
    </div>
    <div class="topbar-right">
      <a class="nav-btn ghost" href="dashboard.html">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a class="nav-btn ghost" href="statements.html">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><line x1="8" y1="13" x2="16" y2="13"/></svg>
        Statements
      </a>
      <a class="nav-btn primary" href="invoice.html">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Invoice
      </a>
    </div>
  </header>

  <div class="page">

    <!-- PAGE HEADER -->
    <div class="page-header">
      <div class="page-title-block">
        <div class="page-eyebrow">Finance</div>
        <div class="page-title">Invoices</div>
      </div>

      <!-- STAT CHIPS -->
      <div class="stat-chips" id="statChips">
        <div class="stat-chip">
          <div class="stat-chip-dot" style="background:#607d8b"></div>
          <span class="stat-chip-label">Total</span>
          <span class="stat-chip-value" id="chipTotal">—</span>
        </div>
        <div class="stat-chip">
          <div class="stat-chip-dot" style="background:#e65100"></div>
          <span class="stat-chip-label">Unpaid</span>
          <span class="stat-chip-value" id="chipUnpaid">—</span>
        </div>
        <div class="stat-chip">
          <div class="stat-chip-dot" style="background:#2e7d32"></div>
          <span class="stat-chip-label">Paid</span>
          <span class="stat-chip-value" id="chipPaid">—</span>
        </div>
        <div class="stat-chip">
          <div class="stat-chip-dot" style="background:#c62828"></div>
          <span class="stat-chip-label">Outstanding</span>
          <span class="stat-chip-value" id="chipOutstanding">—</span>
        </div>
      </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="search-wrap">
        <div class="search-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
        <input class="search-input" type="text" id="search"
          placeholder="Search invoice, waybill, client…" oninput="filterInvoices()">
      </div>

      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setFilter('all', this)">All</button>
        <button class="filter-tab" onclick="setFilter('unpaid', this)">Unpaid</button>
        <button class="filter-tab" onclick="setFilter('paid', this)">Paid</button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Invoice</th>
            <th>Client</th>
            <th>Waybills</th>
            <th>Excl. VAT</th>
            <th>Total</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="invoiceTable">
          <tr class="loading-row"><td colspan="7">Loading invoices…</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    <span id="toastMsg">Done</span>
  </div>

  <script>
    const API_BASE = 'https://bookings.moktransports.com';
    let allInvoices  = [];
    let activeFilter = 'all';

    // ── Load invoices ─────────────────────────────
    async function loadInvoices() {
      try {
        const res  = await fetch(`${API_BASE}/api/invoices`);
        const data = await res.json();
        allInvoices = Array.isArray(data) ? data : [];
        updateChips(allInvoices);
        renderInvoices(applyFilters());
      } catch (err) {
        console.error('Failed to load invoices:', err);
        document.getElementById('invoiceTable').innerHTML =
          `<tr class="empty-row"><td colspan="7">
            <div class="empty-icon">⚠️</div>
            <div class="empty-title">Could Not Load</div>
            <div class="empty-sub">Check your connection and try again.</div>
          </td></tr>`;
      }
    }

    // ── Stats chips ───────────────────────────────
    function updateChips(data) {
      const total       = data.length;
      const unpaid      = data.filter(i => i.status !== 'paid').length;
      const paid        = data.filter(i => i.status === 'paid').length;
      const outstanding = data
        .filter(i => i.status !== 'paid')
        .reduce((s, i) => s + Number(i.total || 0), 0);

      document.getElementById('chipTotal').textContent       = total;
      document.getElementById('chipUnpaid').textContent      = unpaid;
      document.getElementById('chipPaid').textContent        = paid;
      document.getElementById('chipOutstanding').textContent =
        'R\u00a0' + outstanding.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    // ── Filter logic ──────────────────────────────
    function setFilter(filter, btn) {
      activeFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderInvoices(applyFilters());
    }

    function applyFilters() {
      const q = document.getElementById('search').value.toLowerCase();
      return allInvoices.filter(inv => {
        const matchFilter =
          activeFilter === 'all' ||
          (activeFilter === 'paid'   && inv.status === 'paid') ||
          (activeFilter === 'unpaid' && inv.status !== 'paid');
        const matchSearch =
          !q ||
          (inv.invoice_no   || '').toLowerCase().includes(q) ||
          (inv.waybill_no   || '').toLowerCase().includes(q) ||
          (inv.waybill_nos  || '').toLowerCase().includes(q) ||
          (inv.client_name  || '').toLowerCase().includes(q) ||
          (inv.status       || '').toLowerCase().includes(q);
        return matchFilter && matchSearch;
      });
    }

    function filterInvoices() { renderInvoices(applyFilters()) }

    // ── Render table ──────────────────────────────
    function renderInvoices(data) {
      const tbody = document.getElementById('invoiceTable');

      if (!data.length) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="7">
          <div class="empty-icon">📄</div>
          <div class="empty-title">No Invoices Found</div>
          <div class="empty-sub">Try adjusting your search or filter.</div>
        </td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(inv => {
        const waybills = (inv.waybill_nos || inv.waybill_no || '')
          .split(',').map(w => w.trim()).filter(Boolean);

        const waybillsHTML = waybills.length
          ? waybills.map(w => `<span class="waybill-chip">${w}</span>`).join('')
          : `<span class="waybill-none">—</span>`;

        const isPaid = inv.status === 'paid';

        return `<tr onclick="viewInvoice('${inv.invoice_no}')">
          <td>
            <div class="inv-no">${inv.invoice_no}</div>
            <div class="inv-date">${formatDate(inv.invoice_date || inv.created_at)}</div>
          </td>
          <td>
            <div class="client-name">${inv.client_name || '—'}</div>
          </td>
          <td>${waybillsHTML}</td>
          <td>
            <span style="font-size:13px;color:var(--muted)">
              R\u00a0${Number(inv.subtotal||0).toFixed(2)}
            </span>
          </td>
          <td><span class="amount">R\u00a0${Number(inv.total||0).toFixed(2)}</span></td>
          <td>
            <span class="badge ${isPaid ? 'badge-paid' : 'badge-unpaid'}">
              ${isPaid ? 'Paid' : 'Unpaid'}
            </span>
          </td>
          <td onclick="event.stopPropagation()">
            <div class="actions">
              <button class="act-btn act-view" onclick="viewInvoice('${inv.invoice_no}')">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                View
              </button>
              <button class="act-btn act-pdf" onclick="downloadInvoice('${inv.invoice_no}')">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                PDF
              </button>
              <button class="act-btn act-send" onclick="sendInvoiceFromList('${inv.invoice_no}')">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                Send
              </button>
              ${!isPaid ? `<button class="act-btn act-paid" onclick="markPaid('${inv.invoice_no}')">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                Paid
              </button>` : ''}
            </div>
          </td>
        </tr>`;
      }).join('');
    }

    // ── Helpers ───────────────────────────────────
    function formatDate(v) {
      if (!v) return '—';
      return new Date(v).toLocaleDateString('en-ZA', {
        year:'numeric', month:'short', day:'2-digit'
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ── Navigation ────────────────────────────────
    function viewInvoice(invoiceNo) {
      window.location.href = `invoice.html?invoice=${encodeURIComponent(invoiceNo)}`;
    }
    function downloadInvoice(invoiceNo) {
      window.location.href = `invoice.html?invoice=${encodeURIComponent(invoiceNo)}&download=true`;
    }
    function sendInvoiceFromList(invoiceNo) {
      window.location.href = `invoice.html?invoice=${encodeURIComponent(invoiceNo)}&send=true`;
    }

    // ── Mark Paid ─────────────────────────────────
    async function markPaid(invoiceNo) {
      if (!confirm(`Mark ${invoiceNo} as paid?`)) return;
      try {
        const res = await fetch(`${API_BASE}/api/invoices/${invoiceNo}/mark-paid`, { method:'PATCH' });
        if (!res.ok) throw new Error();
        showToast(`${invoiceNo} marked as paid ✓`);
        await loadInvoices();
      } catch {
        alert('Failed to update invoice. Please try again.');
      }
    }

    loadInvoices();
  </script>
</body>
</html>
